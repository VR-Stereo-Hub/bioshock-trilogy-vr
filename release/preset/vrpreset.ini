# BioShock VR - VR preset 1 slider values (toggles are implied ON)
worldScale=100.0
headUpUu=0.0
headFwdUu=0.0
ipdMm=63.0
gameFovDeg=130.0
aimTrimLPitch=-7.5
aimTrimLYaw=37.0
aimTrimRPitch=0.0
aimTrimRYaw=0.0
aimPosLFwd=-2.8
aimPosLRight=0.6
aimPosLUp=0.5
aimPosRFwd=0.0
aimPosRRight=-2.8
aimPosRUp=7.5
bodyRate=0.00
bodyDeadzoneDeg=0.0
turnScale=1.00
snapTurn=0
snapAngleDeg=45
laserOn=0
lockOnDisabled=1
crosshairVisible=0
# Cutscenes (session 29). Bars hidden: the WidescreenBars flash sprite is
# skipped, revealing the full-frame image that was always underneath.
# Subtitles on the head-locked panel: in-frame they are captured per eye from
# different game frames and the text doubles. Drive 1 = authored camera and
# authored hands (2 = authored + head look, 0 = VR drives run through).
cineBarsHidden=1
cineSubsInFrame=0
cineDrive=1
# Water, alcohol tint and damage flashes are textureless fills that the
# post-FX rule cannot catch, so they used to ride the HUD panel. In-frame =
# across the whole view. Set to 0 if scene content ever goes black behind one.
effectsInFrame=1
# Aim dot: off by default; distance is the calibration wall's distance.
aimDotOn=0
aimDotDistM=5.00
aimDotSizeDeg=0.50
hudQuadDistM=1.30
hudQuadWidthM=1.25
hudQuadUpM=-0.10
