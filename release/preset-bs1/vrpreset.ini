# BioShock VR - VR preset 1 slider values (toggles are implied ON)
worldScale=100.0
headUpUu=0.0
headFwdUu=0.0
ipdMm=63.0
gameFovDeg=130.0
aimTrimLPitch=-7.5
aimTrimLYaw=37.0
aimTrimRPitch=0.0
aimTrimRYaw=0.0
aimPosLFwd=-2.8
aimPosLRight=0.6
aimPosLUp=0.5
aimPosRFwd=0.0
aimPosRRight=-2.8
aimPosRUp=7.5
bodyRate=0.00
bodyDeadzoneDeg=0.0
turnScale=1.00
snapTurn=0
snapAngleDeg=45
laserOn=0
lockOnDisabled=1
crosshairVisible=0
# Cutscenes (session 29). Bars hidden: the WidescreenBars flash sprite is
# skipped, revealing the full-frame image that was always underneath.
# Subtitles on the head-locked panel: in-frame they are captured per eye from
# different game frames and the text doubles. Drive 1 = authored camera and
# authored hands (2 = authored + head look, 0 = VR drives run through).
cineBarsHidden=1
cineSubsInFrame=0
cineDrive=1
# Water, alcohol tint and damage flashes ride the HUD panel. v0.5.0 shipped
# this key as 1 (route them into the world) after the built-in default had
# already gone back to 0 - and 1 is what EMPTIES THE HEALTH AND EVE BARS, whose
# colour fills are indistinguishable from an effect fill by every test the
# classifier can apply. Anyone who adopted the v0.5.0 bundle got that bug back.
# Leave it at 0. Routing these in-frame cannot work anyway: the game authors
# them at HUD size, so in the world they are a HUD-sized rectangle in the middle
# of your view rather than a full-screen tint.
effectsInFrame=0
# Swing-to-attack (v0.6.0): swing your right hand to swing the wrench, in
# addition to the trigger. 3.6 m/s is an in-headset calibration - high enough
# that walking, turning your body or reaching never registers as a swing.
swingOn=1
swingThreshold=3.60
swingRearm=1.00
swingCooldownMs=300
swingPulseMs=120
swingDelayMs=0
swingHeadRel=1
# Aim dot: off by default; distance is the calibration wall's distance.
aimDotOn=0
aimDotDistM=5.00
aimDotSizeDeg=0.50
hudQuadDistM=1.30
hudQuadWidthM=1.25
hudQuadUpM=-0.10
