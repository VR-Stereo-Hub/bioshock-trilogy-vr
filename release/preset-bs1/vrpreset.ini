# BioShock VR - VR preset 1 slider values (toggles are implied ON)
worldScale=100.0
# 9 UU above the pawn's own eye point. BRVR's CameraHeightOffset=9, in cm - the
# same number, because 1 UU == 1 cm at worldScale 100. The pawn's eye height was
# authored for a monitor and reads short in a headset.
headUpUu=9.0
headFwdUu=0.0
ipdMm=64.0
gameFovDeg=100.0
aimTrimLPitch=-11.0
aimTrimLYaw=37.0
aimTrimRPitch=0.2
aimTrimRYaw=-4.5
aimPosLFwd=-2.8
aimPosLRight=0.6
aimPosLUp=0.5
aimPosRFwd=0.0
aimPosRRight=-2.1
aimPosRUp=12.9
# Hand and weapon scale. Independent of worldScale by design - the rig can be
# the wrong size while the world is right. The hand scales about the wrist
# anchor, so the gun does not move when you change it. 1.0 = authored size.
#
# 0.80 / 0.80 are BRVR's HandsScale and GunScale, adopted 2026-08-22 for exact
# parity with that mod (the session-61 in-headset numbers were 0.793 / 0.760 -
# within a few percent, so expect parity to look the same rather than fix
# anything). HandsScale and GunScale in BioshockVR.ini set the same two values;
# whatever is in THIS file wins over them, because the preset loads last.
#
# Skeletal weapons scale through their own SkeletonInstance, so body, drum and
# hammer scale together and animations keep playing. A rigid holdable with no
# skeleton - the WRENCH - scales through the actor's DrawScale instead.
handScaleL=0.800
handScaleR=0.800
wScale=0.800
bodyRate=0.00
bodyDeadzoneDeg=0.0
# Instant move direction (session 60): strafe/forward follow the controller
# without the old easing lag.
moveDirInstant=1
turnScale=1.00
snapTurn=0
snapAngleDeg=45
laserOn=0
lockOnDisabled=1
crosshairVisible=0
# Cutscenes (session 29). Bars hidden: the WidescreenBars flash sprite is
# skipped, revealing the full-frame image that was always underneath.
# Subtitles on the head-locked panel: in-frame they are captured per eye from
# different game frames and the text doubles. Drive 1 = authored camera and
# authored hands (2 = authored + head look, 0 = VR drives run through).
cineBarsHidden=1
cineSubsInFrame=0
cineDrive=1
# Water, alcohol tint and damage flashes ride the HUD panel. v0.5.0 shipped
# this key as 1 (route them into the world) after the built-in default had
# already gone back to 0 - and 1 is what EMPTIES THE HEALTH AND EVE BARS, whose
# colour fills are indistinguishable from an effect fill by every test the
# classifier can apply. Anyone who adopted the v0.5.0 bundle got that bug back.
# Leave it at 0. Routing these in-frame cannot work anyway: the game authors
# them at HUD size, so in the world they are a HUD-sized rectangle in the middle
# of your view rather than a full-screen tint.
effectsInFrame=0
effectMaxVerts=8
postFxRtOnly=1
# Swing-to-attack (v0.6.0): swing your right hand to swing the wrench, in
# addition to the trigger. 3.6 m/s is an in-headset calibration - high enough
# that walking, turning your body or reaching never registers as a swing.
swingOn=1
swingThreshold=3.60
swingRearm=1.00
swingCooldownMs=300
swingPulseMs=120
swingDelayMs=0
swingHeadRel=1
# Aim dot: off by default; distance is the calibration wall's distance.
aimDotOn=0
aimDotDistM=5.00
aimDotSizeDeg=0.50
hudQuadDistM=1.30
hudQuadWidthM=1.25
hudQuadUpM=-0.10

# Auto-start VR at launch. 1 = the mod arms the full VR stack itself on the
# first frame (no F10 needed); 0 = the old behaviour, arm it from the F10
# preset button. Set this to 0 WITH THE GAME CLOSED if a launch ever misbehaves
# - it is the same switch as the "Auto-start VR at launch" checkbox in F10.
autoVr=1
