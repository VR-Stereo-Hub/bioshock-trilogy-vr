; ============================================================================
;  BioshockVR.ini
;  Controller configuration for the BioShock Trilogy VR mod.
; ----------------------------------------------------------------------------
;  WHERE THIS FILE GOES
;    %LOCALAPPDATA%\BioshockVR\ for BioShock 1. BioShock 2 and Infinite read
;    their own copy from the bs2\ and bsi\ subfolders - the games never share
;    files, and their face buttons genuinely mean different things.
;
;  HOW TO CHECK A SETTING ACTUALLY TOOK
;    bioshockvr.log appears in the same folder and echoes the whole resolved
;    table at startup. If a change is not in that echo, it did not take.
;
;  FORMATTING RULES -- these will bite you
;    1. Comments go on their OWN line, starting with ';'.
;       NEVER put a comment after a value; Windows reads it as data.
;    2. A line starting with ';' is IGNORED COMPLETELY. To switch on a setting
;       that is commented out, delete the leading semicolon.
;    3. An unknown key is ignored. A recognised key with an unrecognised VALUE
;       is logged loudly, so check the log echo before concluding anything.
; ============================================================================

[VR]

; ############################################################################
; #  FACE BUTTONS                                                            #
; ############################################################################

; passthrough  (default) the game's own layout, nothing rearranged:
;              A = use, B = med hypo, X = reload/hack/EVE, Y = jump.
; session19    the older rearrangement: Touch B = jump, Touch Y = first aid,
;              A stays use/loot. Still what BioShock 2 uses.
FaceLayout=passthrough

; Individual overrides on top of the layout above.
; Names: A B X Y LB RB LS RS DUP DDOWN DLEFT DRIGHT START BACK NONE
;
;FaceA=A
;FaceB=B
;FaceX=X
;FaceY=Y
;GripL=LB
;GripR=RB
;StickClickL=LS
;StickClickR=NONE

; ############################################################################
; #  D-PAD (AMMO SELECT)                                                     #
; ############################################################################

; While held, one stick stops steering and works as a D-pad instead.
;   0 = off
;   1 = right thumbrest (capacitive touch)  -- Quest 2/3/Pro, Rift S. DEFAULT.
;   2 = right stick click (R3)              -- RIFT CV1, INDEX, BEYOND,
;                                              VARJO, SOMNIUM
;   3 = left grip
;   4 = left thumbrest touch
; Mode 5 (left controller near your head) is not implemented here yet.
;
; Rift CV1 has no thumbrest sensor at all, so 1 and 4 can never fire for it.
; Index/Beyond/Varjo/Somnium must also use 2 for the opposite reason: their
; "thumbrest" is the TRACKPAD, where a thumb naturally rests, and the modifier
; is HELD -- so resting your thumb would suppress movement.
ControllerDpadModifier=1

; 0 = right thumbrest modifier + LEFT stick. Walking stops while held. DEFAULT.
; 1 = LEFT thumbrest modifier + RIGHT stick. Walking never stops, turning is
;     suspended instead.
; The modifier is always the opposite hand from the stick: one thumb cannot
; rest on a thumbrest and push that same stick at the same time.
ControllerDpadFlip=0

; ############################################################################
; #  JUMP                                                                    #
; ############################################################################

; R3 jumps instead of zooming. Zoom is unusable in VR -- it drives a separate
; FOV field and breaks the weapon calibration -- and is already unreachable in
; this mod. Additive: the layout's normal jump button still jumps.
; Ignored when ControllerDpadModifier=2, which needs R3 for the d-pad.
JumpOnR3=1

; ############################################################################
; #  TURN SPEED                                                              #
; ############################################################################

; The game's own turn rate is nearly VERTICAL at the top of the stick:
; measured, 0.98 gives ~105 deg/s, 0.99 gives ~140, and 1.00 gives ~200. A 2%
; difference in how hard you push doubled the speed, which is why turning felt
; consistent while held and different every time you re-pushed.
;
; TurnAxisMax caps what the game is ever sent, so that cliff is unreachable and
; the same push always turns you at the same rate. 0.95 gives roughly 90-110
; deg/s. Raise toward 1.00 for the old top speed, lower for a gentler turn.
TurnAxisMax=0.95

; Shapes the rest of the range. 1.0 is linear; above 1.0 gives finer control
; near the centre.
TurnAxisExp=1.0

; The GAME's own turn sensitivity, which the mod writes into Bioshock.ini for
; you -- it is the in-game options slider, where 70 here is "7" there. The
; shipped default reads far too slow once the right stick is the only way to
; turn, especially under the TurnAxisMax cap above.
;
; SET THIS TO -1 to leave whatever you chose in the game's own options alone.
; The startup log reads the value back, so you can see what actually took.
GameTurnSpeed=70

; ############################################################################
; #  WALKING DIRECTION                                                       #
; ############################################################################

; The game applies its deadzone PER AXIS (0.225, in its own User.ini bindings).
; The mod rotates your movement stick to keep the walk direction instant while
; the body yaw catches up, and rotating moves magnitude between the two axes --
; so the game's per-axis threshold then bends the direction, by up to ~11
; degrees, and snaps you to a pure sidestep once the forward part gets small.
;
; That is the "turning while walking feels like it keeps snapping a few degrees"
; report: the rotation is only non-zero WHILE TURNING and the stick is only
; pushed WHILE WALKING, so it needs both at once and never shows up standing.
;
; StickPrecomp undoes it, so the game walks you where you actually asked.
; Turn it off only to compare against the old behaviour.
StickPrecomp=1

; Must match the game's own value. 0.225 is what BioShock Remastered ships;
; change it only if your User.ini says something else.
GameStickDeadzone=0.225

; ############################################################################
; #  SIZE AND HEIGHT                                                         #
; ############################################################################

; NOTE ON PRECEDENCE: if you have ever pressed SAVE in the F10 panel there is a
; vrpreset.ini next to this file, and it loads LATER and WINS over all three
; keys below. The startup log echo says which values actually took.

; Size of the viewmodel hands and of the weapon. 1.0 = the size the game's
; artists authored; 0.8 is the shipped default and is BRVR's HandsScale/GunScale.
; Deliberately independent of world scale - the rig can be the wrong size while
; the world is right.
HandsScale=0.8
GunScale=0.8

; Height of the camera above the game's own eye point, IN CENTIMETRES, + is up.
; The pawn's eye height was authored for a monitor and reads short in VR.
; Raise if you feel too short; lower if you feel like you are floating.
CameraHeightOffset=9
